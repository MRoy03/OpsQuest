<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Server rack — left background -->
  <rect x="1" y="10" width="11" height="30" rx="1.5" fill="#152238"/>
  <rect x="2.5" y="12" width="8" height="3.5" rx="0.8" fill="#0d1f35"/>
  <circle cx="9" cy="13.8" r="1.1" fill="#10b981"/>
  <rect x="2.5" y="17" width="8" height="3.5" rx="0.8" fill="#0d1f35"/>
  <circle cx="9" cy="18.8" r="1.1" fill="#00d4ff"/>
  <rect x="2.5" y="22" width="8" height="3.5" rx="0.8" fill="#0d1f35"/>
  <circle cx="9" cy="23.8" r="1.1" fill="#10b981"/>
  <rect x="2.5" y="27" width="8" height="3.5" rx="0.8" fill="#0d1f35"/>
  <circle cx="9" cy="28.8" r="1.1" fill="#f59e0b"/>
  <rect x="2.5" y="32" width="8" height="3.5" rx="0.8" fill="#0d1f35"/>
  <circle cx="9" cy="33.8" r="1.1" fill="#10b981"/>

  <!-- Monitor body -->
  <rect x="13" y="5" width="40" height="30" rx="2.5" fill="#1a2f4a"/>
  <!-- Screen -->
  <rect x="15" y="7" width="36" height="26" rx="1.5" fill="#060b18"/>

  <!-- Code on screen (syntax-highlighted terminal) -->
  <!-- Line 1 -->
  <rect x="17" y="9.5" width="7" height="2" rx="0.5" fill="#c084fc"/>
  <rect x="25" y="9.5" width="11" height="2" rx="0.5" fill="#00d4ff"/>
  <rect x="37" y="9.5" width="4" height="2" rx="0.5" fill="#e2e8f0" opacity="0.5"/>
  <!-- Line 2 -->
  <rect x="19" y="13" width="5" height="2" rx="0.5" fill="#10b981"/>
  <rect x="25" y="13" width="9" height="2" rx="0.5" fill="#00d4ff" opacity="0.85"/>
  <rect x="35" y="13" width="3" height="2" rx="0.5" fill="#e2e8f0" opacity="0.45"/>
  <rect x="39" y="13" width="7" height="2" rx="0.5" fill="#f59e0b" opacity="0.8"/>
  <!-- Line 3 -->
  <rect x="19" y="16.5" width="4" height="2" rx="0.5" fill="#c084fc"/>
  <rect x="24" y="16.5" width="7" height="2" rx="0.5" fill="#10b981" opacity="0.9"/>
  <rect x="32" y="16.5" width="3" height="2" rx="0.5" fill="#e2e8f0" opacity="0.4"/>
  <rect x="36" y="16.5" width="10" height="2" rx="0.5" fill="#00d4ff" opacity="0.7"/>
  <!-- Line 4 -->
  <rect x="19" y="20" width="14" height="2" rx="0.5" fill="#10b981" opacity="0.65"/>
  <rect x="34" y="20" width="5" height="2" rx="0.5" fill="#e2e8f0" opacity="0.35"/>
  <!-- Line 5 -->
  <rect x="17" y="23.5" width="2.5" height="2" rx="0.5" fill="#e2e8f0" opacity="0.55"/>
  <!-- Cursor -->
  <rect x="20.5" y="23.5" width="2" height="2" rx="0.3" fill="#00d4ff" opacity="0.9"/>
  <!-- Status bar at bottom of screen -->
  <rect x="15" y="31" width="36" height="2" fill="#0d1f35"/>
  <rect x="16" y="31.4" width="6" height="1.2" rx="0.3" fill="#10b981" opacity="0.7"/>
  <rect x="23" y="31.4" width="10" height="1.2" rx="0.3" fill="#1a2f4a"/>
  <rect x="44" y="31.4" width="6" height="1.2" rx="0.3" fill="#00d4ff" opacity="0.5"/>

  <!-- Monitor stand neck -->
  <rect x="30.5" y="35" width="5" height="5" fill="#1a2f4a"/>
  <!-- Monitor stand base -->
  <rect x="24" y="40" width="18" height="2.5" rx="1.2" fill="#1a2f4a"/>

  <!-- Keyboard -->
  <rect x="13" y="45" width="34" height="11" rx="2" fill="#152238"/>
  <!-- Key row 1 -->
  <rect x="14.5" y="46.5" width="3.5" height="2.5" rx="0.5" fill="#0d1f35"/>
  <rect x="19" y="46.5" width="3.5" height="2.5" rx="0.5" fill="#0d1f35"/>
  <rect x="23.5" y="46.5" width="3.5" height="2.5" rx="0.5" fill="#0d1f35"/>
  <rect x="28" y="46.5" width="3.5" height="2.5" rx="0.5" fill="#0d1f35"/>
  <rect x="32.5" y="46.5" width="3.5" height="2.5" rx="0.5" fill="#0d1f35"/>
  <rect x="37" y="46.5" width="3.5" height="2.5" rx="0.5" fill="#0d1f35"/>
  <rect x="41.5" y="46.5" width="3.5" height="2.5" rx="0.5" fill="#0d1f35"/>
  <!-- Spacebar row -->
  <rect x="14.5" y="50.5" width="3" height="2.5" rx="0.5" fill="#0d1f35"/>
  <rect x="18.5" y="50.5" width="20" height="2.5" rx="0.5" fill="#0d1f35"/>
  <rect x="40" y="50.5" width="3" height="2.5" rx="0.5" fill="#0d1f35"/>
  <rect x="44" y="50.5" width="2" height="2.5" rx="0.5" fill="#0d1f35"/>

  <!-- Mouse (right of keyboard) -->
  <rect x="50" y="46" width="12" height="16" rx="6" fill="#152238"/>
  <line x1="56" y1="46" x2="56" y2="52" stroke="#0d1f35" stroke-width="1.2"/>
  <!-- Scroll wheel -->
  <rect x="54.8" y="48" width="2.4" height="4" rx="1.2" fill="#00d4ff" opacity="0.45"/>

  <!-- Network dots top-right (decorative) -->
  <circle cx="50" cy="8" r="1.2" fill="#10b981" opacity="0.7"/>
  <circle cx="54" cy="8" r="1.2" fill="#10b981" opacity="0.45"/>
  <circle cx="58" cy="8" r="1.2" fill="#00d4ff" opacity="0.3"/>
</svg>
